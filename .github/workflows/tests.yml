name: Tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'main/**'
      - 'test/**'
      - 'benchmark/**'
      - 'nob.c'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: |
          cc run/nob.c -o run/nob
          run/nob test && run/nob benchmark 
