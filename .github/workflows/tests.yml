name: Tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'main/**'
      - 'test/**'
      - 'benchmark/**'
      - 'run/**'
  workflow_dispatch:

# this actions stolen from nob
jobs:

  ubuntu-arm64:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@master
      - run: cc -x c -o run/build run/build.c
      - run: run/build info && run/build test && run/build benchmark

  ubuntu-x64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@master
      - run: cc -x c -o run/build run/build.c
      - run: run/build info && run/build test && run/build benchmark

