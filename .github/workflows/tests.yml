name: Tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'main/**'
      - 'test/**'
      - 'benchmark/**'
      - 'run/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@latest
      - uses: rlalik/setup-cpp-compiler@latest
        with:
          compiler: gcc-latest
      - run: gcc -o run/build -I./run run/build.c
      - run: run/build info
      - run: run/build test
      - run: run/build benchmark 

