name: Tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'main/**'
      - 'test/**'
      - 'benchmark/**'
      - 'run/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-11-arm, windows-2025, ubuntu-slim, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: gcc-latest
      - run: gcc -o run/build -I./run run/build.c run/nob.c run/nob_extra.c
      - run: run/build test
      - run: run/build benchmark 

