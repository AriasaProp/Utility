name: Tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'main/**'
      - 'test/**'
      - 'benchmark/**'
      - 'run/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-11-vs2026-arm
            pre-nob: clang-cl.exe Fe:run/nob.c run/nob
          - os: windows-2025-vs2026
            pre-nob: cl.exe Fe:run/nob.c run/nob
          - os: ubuntu-slim
            pre-nob: cc run/nob.c -o run/nob
          - os: ubuntu-26.04
            pre-nob: cc run/nob.c -o run/nob
          - os: ubuntu-26.04-arm
            pre-nob: cc run/nob.c -o run/nob
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
      - run: ${{ matrix.pre-nob }}
      - run: run/nob test
      - run: run/nob benchmark 

